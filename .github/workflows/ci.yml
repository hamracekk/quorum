name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt + clippy).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The desktop app (crates/app, Tauri 2) links the system webview: WebKitGTK on Linux.
      - name: Desktop app system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Format
        run: cargo fmt-check
      - name: Clippy
        run: cargo lint
      - name: Test
        run: cargo test --workspace --all-features

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Vite 8 needs Node >= 20.19 / 22.12 (pinned in .prototools).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

