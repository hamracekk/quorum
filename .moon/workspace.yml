# moonrepo workspace — quorum
$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  globs:
    - 'crates/*'   # Rust crates (one cargo workspace, one moon project per crate)
  sources:
    # Root-level project: workspace-wide composite tasks (root:verify).
    root: '.'

vcs:
  client: 'git'
  provider: 'github'
  defaultBranch: 'main'
