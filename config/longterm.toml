# The long-term book (DESIGN §20): buy-and-hold investing, separate from the trading slots.
# Operator-written. The first policy is yours; the others are alternatives it is compared with
# by `quorum longterm backtest`.
#
# EXAMPLE VALUES, not advice: replace the weights and amounts with your own decision. US-listed
# ETFs stand in for the UCITS funds an EU investor would hold (same indices) until IBKR supplies
# those prices: SPY/EFA/EEM ≈ an all-world fund (e.g. VWCE), IEF ≈ intermediate government bonds
# (e.g. EUR-hedged AGGH), GLD ≈ physical gold (e.g. SGLN).

prices_from = "multi-asset"
fx_cost = 0.0015        # one CZK ↔ USD conversion at a retail broker
fee_rate = 0.0005       # commission per trade
slippage_bps = 2.0

# The paper book (`quorum longterm paper`, every 6 hours under launchd) runs the FIRST policy below
# from the day it starts: paper money, contributions on the first trading day of each month.
# Changing that policy later needs `quorum longterm paper --fresh` (a new session).

# The AI review of the paper book (DESIGN §20): it only proposes new target weights; each is
# costed (trading + tax on lots under three years), journaled, decided by you
# (`quorum longterm reviews`, `decide`) and scored against keeping the book unchanged.
[review]
enabled = true
model = "claude-opus-5-5"   # one call a quarter: cents
effort = "high"
every_days = 91

[[policies]]
name = "balanced (example)"
start_czk = 100000      # invested at the start
monthly_czk = 5000      # added every month
band = 0.05             # rebalance when a holding is 5 points off its target
holdings = [
  { instrument = "tiingo:SPY:equity", weight = 0.38 },
  { instrument = "tiingo:EFA:equity", weight = 0.16 },
  { instrument = "tiingo:EEM:equity", weight = 0.06 },
  { instrument = "tiingo:IEF:equity", weight = 0.30 },
  { instrument = "tiingo:GLD:equity", weight = 0.10 },
]

[[policies]]
name = "world equity only"
start_czk = 100000
monthly_czk = 5000
band = 0.05
holdings = [
  { instrument = "tiingo:SPY:equity", weight = 0.64 },
  { instrument = "tiingo:EFA:equity", weight = 0.26 },
  { instrument = "tiingo:EEM:equity", weight = 0.10 },
]

[[policies]]
name = "60/40 world"
start_czk = 100000
monthly_czk = 5000
band = 0.05
holdings = [
  { instrument = "tiingo:SPY:equity", weight = 0.38 },
  { instrument = "tiingo:EFA:equity", weight = 0.16 },
  { instrument = "tiingo:EEM:equity", weight = 0.06 },
  { instrument = "tiingo:IEF:equity", weight = 0.40 },
]
