# Passive alternatives quorum must beat after costs (DESIGN §11). If the book cannot beat these,
# the better answer is to hold them. Operator-written; `quorum allocate` compares every variant
# against each, and the daily paper summary reports `summary` over the session.
#
# Priced from the research slot's stored bars (Tiingo adjusted closes: dividends included).
# US-listed ETFs stand in for their UCITS equivalents (an EU investor would hold e.g. a world
# equity or S&P 500 UCITS fund), which track the same indices. Before tax: in CZ a passive fund
# held over 3 years is tax-free, quorum's trading is not.

slot = "multi-asset"
summary = "60/40"

# Czech tax on the trading slots' gains (§10 ZDP, operator assumption to confirm with an advisor):
# 15% of each calendar year's net gain, nothing in a losing year, no loss carried forward. The
# passive portfolios are taken as held over 3 years: tax-free. 0 turns the after-tax view off.
trading_tax = 0.15

# Compared in the investor's currency, at Czech National Bank fixings (the rates Czech tax uses):
# exchange moves are part of the return and of the taxable gain. `fx_cost`: one conversion's cost
# (in at the start, out at the end), e.g. ~0.15% at a retail broker.
currency = "CZK"
fx_cost = 0.0015

[[portfolios]]
name = "US equity"
holdings = [{ instrument = "tiingo:SPY:equity", weight = 1.0 }]

# Global equity at roughly MSCI ACWI's split (US 64%, developed ex-US 26%, emerging 10%): what
# an all-world fund (e.g. VWCE) holds. The fairer bar than US equity alone, the century's winner.
[[portfolios]]
name = "world equity"
rebalance_days = 21
holdings = [
  { instrument = "tiingo:SPY:equity", weight = 0.64 },
  { instrument = "tiingo:EFA:equity", weight = 0.26 },
  { instrument = "tiingo:EEM:equity", weight = 0.10 },
]

[[portfolios]]
name = "60/40"
rebalance_days = 21
holdings = [
  { instrument = "tiingo:SPY:equity", weight = 0.6 },
  { instrument = "tiingo:TLT:equity", weight = 0.4 },
]

[[portfolios]]
name = "cash (short Treasuries)"
holdings = [{ instrument = "tiingo:SHY:equity", weight = 1.0 }]
