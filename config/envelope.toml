# The operator's envelope (DESIGN §5.1, decision §19.2). Read-only to quorum: nothing in the
# system writes this file or can loosen what it says. Edit it by hand, review the diff, commit.
#
# Current decision: PAPER ONLY. No live capital; no slot can rise above `paper`.
# Raising a slot to `live-micro` also needs an always-on server (§19.3).

currency = "EUR"
capital_total = 0
leverage_max = 1.0

# Venues quorum may trade on, paper included. Binance supplies crypto data and paper fills;
# its EU/CZ status must be confirmed before it can carry real money (§19.1). Tiingo is a price
# source, not a broker: allowed for paper only (operator decision 2026-10-16), so the ETF slot
# trades simulated fills on end-of-day prices until IBKR replaces it.
venues_allowed = ["binance", "tiingo"]

# Fractions of equity. Enforced in paper too, so the limits are tested before money is at risk.
# Daily 5% (operator decision 2026-10-16): on daily crypto 2% halted 17 times a year and hurt
# (`quorum backtest --daily-loss`); 5% halts about twice a year with the smallest drawdown.
loss = { daily_max = 0.05, total_max = 0.15 }

# Concentration (operator decision 2026-10-16), enforced by the risk process on every order that
# adds risk. One position at most 25% of a slot's equity (crypto-spot holds ~3% each today). The
# positions moving together with an instrument (return correlation ≥ 0.7, itself included) at
# most 100% of equity: no limit beyond leverage while one market is traded; lower it as the book
# spans more markets.
position_max = 0.25
cluster_max = 1.0

# Bounds for every slot without its own entry below.
slot_default = { capital_max = 0, max_mode = "paper" }

# The long-term book (DESIGN §20): buy-and-hold, apart from the slots and the allocator. No loss
# halts (it rides out drawdowns by design; the kill switch still applies). A broad index fund may
# be most of it, so one holding may reach 70% of the book (operator decision pending; example).
[longterm]
capital_max = 0
max_mode = "paper"
position_max = 0.70

# Per-slot overrides, e.g.:
# [slots.crypto-spot]
# capital_max = 2000
# max_mode = "live-micro"
