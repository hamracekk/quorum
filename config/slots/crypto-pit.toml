# Crypto spot, point in time: crypto-spot's strategy on a survivorship-free universe. Each month
# it trades the 25 USDT pairs with the most dollar volume over the previous 60 days, among every
# pair Binance ever listed (delisted ones included, from the public archive). Research only:
# this is the honest test of the crypto slot, whose fixed list is today's survivors.
#
#   quorum research sync --slot crypto-pit     # once: every USDT pair from data.binance.vision
#   quorum backtest --slot crypto-pit          # compare with --slot crypto-spot

id = "crypto-pit"
venue = "binance"
interval = "1d"
calendar = "always-open"
start_mode = "research"
paper_capital = 10000
history_days = 730

[universe]
kind = "top-volume"
size = 25               # as many as crypto-spot holds
window = 60             # bars of dollar volume behind the ranking
refresh = 30            # re-rank monthly
min_history = 365       # a pair needs a year of bars to join (trader ADR 0007)

[strategy]
kind = "trend-momentum"
lookback = 60

[sizing]
target_vol = 0.6
vol_bars = 30
band = 0.25
portfolio_vol = 0.35
portfolio_vol_bars = 60

[brakes.vol_regime]
ratio = 1.5
scale = 0.5
short_bars = 20
long_bars = 365

[exits]
stale_bars = 5          # no daily bar for 5 days: treated as delisted, sold at the last close

[costs]
fee_rate = 0.001
slippage_bps = 2.0
impact = 0.05
