# The impact map (DESIGN §8, trader ADR 0008): themes news can be about and what each moves,
# written and versioned by the operator. Models classify items into these themes; they never add
# or change a link. Each link is a hypothesis with its own record from `since`: it earns weight
# only if the moves it implies come true out of sample. `sign`: 1 moves with the theme, -1 against.

[[themes]]
id = "us-rates"
description = "US interest rates or rate expectations (Fed decisions, inflation surprises); up = higher rates"
links = [
  { instrument = "tiingo:TLT:equity", sign = -1, since = "2026-10-16", why = "Long bond prices fall as yields rise" },
  { instrument = "tiingo:IEF:equity", sign = -1, since = "2026-10-16", why = "Mid-term bond prices fall as yields rise" },
  { instrument = "tiingo:QQQ:equity", sign = -1, since = "2026-10-16", why = "Growth stocks are rate-sensitive" },
  { instrument = "tiingo:SPY:equity", sign = -1, since = "2026-10-16", why = "Higher discount rates for all equities" },
  { instrument = "tiingo:UUP:equity", sign = 1, since = "2026-10-16", why = "Higher US rates attract capital into dollars" },
  { instrument = "tiingo:GLD:equity", sign = -1, since = "2026-10-16", why = "Gold pays no yield; dearer money weighs on it" },
  { instrument = "binance:BTCUSDT", sign = -1, since = "2026-10-16", why = "Higher rates make risk assets less attractive" },
]

