# UCITS funds quorum may hold (EU retail: UCITS funds with a KID only, DESIGN §19.1), keyed by
# ISIN — how IBKR finds a contract. Listings are where each fund trades; `verified = false` until
# they are confirmed against IBKR's contract search once the account exists (tickers differ by
# exchange, and some here come from secondary sources: docs/long-term-investing.md).
# `stand_in`: the US-listed fund on the same index that research uses until IBKR's prices exist.
# A list of candidates, not a recommendation.

