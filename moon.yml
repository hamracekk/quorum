# Root-level project — workspace-wide composite tasks only (deps, `noop` itself).
layer: 'automation'
language: 'unknown'

tasks:
  # Every quality gate for every crate, maximally parallel (same coverage as CI).
  #   moon run root:verify
  verify:
    command: 'noop'
    deps:
      - 'core:fmt'
      - 'core:lint'
      - 'core:test'
      - 'data:fmt'
      - 'data:lint'
      - 'data:test'
      - 'news:fmt'
      - 'news:lint'
      - 'news:test'
      - 'predictions:fmt'
      - 'predictions:lint'
      - 'predictions:test'
      - 'hyperliquid:fmt'
      - 'hyperliquid:lint'
      - 'hyperliquid:test'
      - 'ai:fmt'
      - 'ai:lint'
      - 'ai:test'
      - 'lab:fmt'
      - 'lab:lint'
      - 'lab:test'
      - 'bus:fmt'
      - 'bus:lint'
      - 'bus:test'
      - 'journal:fmt'
      - 'journal:lint'
      - 'journal:test'
      - 'service:fmt'
      - 'service:lint'
      - 'service:test'
      - 'server:fmt'
      - 'server:lint'
      - 'server:test'
      - 'dashboard:lint'
      - 'dashboard:typecheck'
      - 'dashboard:build'
      - 'mcp:fmt'
      - 'mcp:lint'
      - 'mcp:test'
      - 'cli:fmt'
      - 'cli:lint'
      - 'cli:test'
      - 'app:fmt'
      - 'app:lint'
      - 'app:test'
    options:
      cache: false
      runInCI: false
