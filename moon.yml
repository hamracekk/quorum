# Root-level project — workspace-wide composite tasks only (deps, `noop` itself).
layer: 'automation'
language: 'unknown'

tasks:
  # Every quality gate for every crate, maximally parallel (same coverage as CI).
  #   moon run root:verify
  verify:
    command: 'noop'
    deps:
      - 'core:fmt'
      - 'core:lint'
      - 'core:test'
      - 'data:fmt'
      - 'data:lint'
      - 'data:test'
      - 'news:fmt'
      - 'news:lint'
      - 'news:test'
      - 'predictions:fmt'
      - 'predictions:lint'
      - 'predictions:test'
      - 'hyperliquid:fmt'
      - 'hyperliquid:lint'
      - 'hyperliquid:test'
      - 'ai:fmt'
      - 'ai:lint'
      - 'ai:test'
      - 'lab:fmt'
      - 'lab:lint'
      - 'lab:test'
      - 'ml:fmt'
      - 'ml:lint'
      - 'ml:test'
      - 'bus:fmt'
      - 'bus:lint'
      - 'bus:test'
      - 'journal:fmt'
      - 'journal:lint'
      - 'journal:test'
      - 'envelope:fmt'
      - 'envelope:lint'
      - 'envelope:test'
      - 'slots:fmt'
      - 'slots:lint'
      - 'slots:test'
      - 'runner:fmt'
      - 'runner:lint'
      - 'runner:test'
      - 'recorder:fmt'
      - 'recorder:lint'
      - 'recorder:test'
      - 'notify:fmt'
      - 'notify:lint'
      - 'notify:test'
      - 'knowledge:fmt'
      - 'knowledge:lint'
      - 'knowledge:test'
      - 'risk:fmt'
      - 'risk:lint'
      - 'risk:test'
      - 'evaluator:fmt'
      - 'evaluator:lint'
      - 'evaluator:test'
      - 'cli:fmt'
      - 'cli:lint'
      - 'cli:test'
    options:
      cache: false
      runInCI: false
