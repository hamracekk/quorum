[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
arrow-array = "60"
arrow-schema = "60"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
# Signed exchange requests (T-7 testnet executor): HMAC-SHA256, hex.
hex = "0.4"
hmac = "0.13"
# Binance public data archive (R-1): monthly kline zips.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.11"
futures-util = "0.3"
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing — replayed prices must be bit-identical to recorded ones.
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2"
# Operator config files (envelope, slots).
toml = "0.9"
# News feeds: RSS 0.x/1.0/2.0, Atom and JSON Feed.
feed-rs = "3"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Run and session ids (UUID v7: time-ordered).
uuid = { version = "1", features = ["v7"] }
# Binaries: command line and error context.
clap = { version = "4", features = ["derive"] }
wiremock = "0.6"
quorum-bus = { path = "crates/bus" }
quorum-core = { path = "crates/core" }
quorum-data = { path = "crates/data" }
quorum-news = { path = "crates/news" }
quorum-predictions = { path = "crates/predictions" }
quorum-hyperliquid = { path = "crates/hyperliquid" }
quorum-ai = { path = "crates/ai" }
quorum-journal = { path = "crates/journal" }
quorum-lab = { path = "crates/lab" }
quorum-ml = { path = "crates/ml" }
quorum-envelope = { path = "crates/envelope" }
quorum-slots = { path = "crates/slots" }
quorum-runner = { path = "crates/runner" }

# Centralized lint policy — every crate opts in with `[lints] workspace = true`.
# Levels are `warn` locally (so dev builds stay usable); `cargo lint` and CI pass
# `-D warnings`, turning any of these into a hard failure.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Lint GROUPS get priority -1 so the specific allows below always win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Curated allow-list: pedantic/nursery lints that are noisy or not worth it for
# unpublished crates. Trim this list as the code matures.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow" # transitive dep dupes we don't control
cargo_common_metadata = "allow"   # unpublished crates: no readme/keywords/etc.
# Numeric code: bar counts and seconds cast to f64 never approach 2^52.
cast_precision_loss = "allow"
# Conflicts with the `unreachable_pub` rustc lint above; keep `pub(crate)`.
redundant_pub_crate = "allow"
