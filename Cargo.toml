[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
async-trait = "0.1"
arrow-array = "60"
arrow-schema = "60"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
csv = "1"
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing — replayed prices must be bit-identical to recorded ones.
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
wiremock = "0.6"
trader-bus = { path = "crates/bus" }
trader-core = { path = "crates/core" }
trader-data = { path = "crates/data" }
trader-journal = { path = "crates/journal" }
trader-lab = { path = "crates/lab" }
trader-mcp = { path = "crates/mcp" }
trader-server = { path = "crates/server" }
trader-service = { path = "crates/service" }

# Centralized lint policy — every crate opts in with `[lints] workspace = true`.
# Levels are `warn` locally (so dev builds stay usable); `cargo lint` and CI pass
# `-D warnings`, turning any of these into a hard failure.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Lint GROUPS get priority -1 so the specific allows below always win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Curated allow-list: pedantic/nursery lints that are noisy or not worth it for
# unpublished crates. Trim this list as the code matures.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow" # transitive dep dupes we don't control
cargo_common_metadata = "allow"   # unpublished crates: no readme/keywords/etc.
# Numeric code: bar counts and seconds cast to f64 never approach 2^52.
cast_precision_loss = "allow"
# Conflicts with the `unreachable_pub` rustc lint above; keep `pub(crate)`.
redundant_pub_crate = "allow"
